name: Build NEXT APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Estrai progetto
        run: unzip NEXT_2_4_ANDROID_PROJECT_READY.zip
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa SDK Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compila APK
        working-directory: NEXT_2_2_ANDROID_PROJECT
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepara APK
        run: cp NEXT_2_2_ANDROID_PROJECT/app/build/outputs/apk/debug/app-debug.apk NEXT-2.2.apk

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXT-2.2-APK
          path: NEXT-2.2.apk
